name: Update PR server last-seen list

on:
  schedule:
    - cron: "10 0 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-server-last-seen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update server list
        run: python scripts/parse_prspy_data.py

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain -- data/servers_last_seen.tsv)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/servers_last_seen.tsv
          git commit -m "Update PR server last-seen data"
          git push
